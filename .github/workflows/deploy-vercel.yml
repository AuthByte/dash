name: deploy-vercel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing GitHub secret VERCEL_TOKEN. Create a token at https://vercel.com/account/tokens"
            exit 1
          fi
          npx vercel deploy --yes --prod --token "$VERCEL_TOKEN" --name dash
